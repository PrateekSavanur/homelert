apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelert
  namespace: homelert
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: homelert.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homelert
                port:
                  number: 80
